name: Build Telkomsel Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -q Telkomsel_Launcher_Single_ZIP_IconShape.zip -d extracted

      - name: Find Gradle project
        id: project
        run: |
          SETTINGS=$(find extracted -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Build APK
        run: |
          gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telkomsel-Launcher-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
